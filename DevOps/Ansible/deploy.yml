---
- name: Test playbook - Install and run nginx
  hosts: webservers
  become: yes
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install nginx
      apt:
        name: nginx
        state: present
    
    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes
    
    - name: Create test webpage
      copy:
        content: "<h1>Hello from Ansible on EC2!</h1>"
        dest: /var/www/html/index.html